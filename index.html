    <script>
        (function () {

            webSdkScript.src =

                        name: "littlelink-trenigma-dev",
                        version: "1.0.0",
                        environment: "production",
                    },
                    instrumentations: [
                        ...window.GrafanaFaroWebSdk.getWebInstrumentations(),
                    ],
                });
                var webTracingScript = document.createElement("script");
                webTracingScript.src =
                    "https://unpkg.com/@grafana/faro-web-tracing@2/dist/bundle/faro-web-tracing.iife.js";
                webTracingScript.onload = () => {
                    window.GrafanaFaroWebSdk.faro.instrumentations.add(
                        new window.GrafanaFaroWebTracing.TracingInstrumentation()
                    );
                };
                document.head.appendChild(webTracingScript);
            };
            document.head.appendChild(webSdkScript);
        })();

    <!-- Theme Toggle Script -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const icon = themeToggle.querySelector('i');

        // Check for saved theme preference or default to dark
        const currentTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', currentTheme);
        updateIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }
    </script>

    <!-- Faro Button Click Tracking -->
    <script>
        // Wait for Faro to be loaded, then track button clicks
        window.addEventListener('load', () => {
            // Give Faro a moment to initialize
            setTimeout(() => {
                if (window.GrafanaFaroWebSdk && window.GrafanaFaroWebSdk.faro) {
                    const faro = window.GrafanaFaroWebSdk.faro;

                    // Track all link button clicks
                    document.querySelectorAll('.link-button').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const buttonName = e.currentTarget.querySelector('span').textContent;
                            const buttonUrl = e.currentTarget.getAttribute('href');

                            // Send click event to Faro
                            faro.api.pushEvent('button_click', {
                                button_name: buttonName,
                                button_url: buttonUrl
                            });

                            console.log('Tracked click:', buttonName);
                        });
                    });

                    // Track vCard download
                    const vcardButton = document.querySelector('a[download]');
                    if (vcardButton) {
                        vcardButton.addEventListener('click', () => {
                            faro.api.pushEvent('vcard_download', {
                                action: 'download_vcard'
                            });
                            console.log('Tracked vCard download');
                        });
                    }

                    console.log('Faro button tracking initialized');
                } else {
                    console.warn('Faro not loaded, button tracking disabled');
                }
            }, 1000);
        });
    </script>
